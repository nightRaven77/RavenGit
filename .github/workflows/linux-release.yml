name: Linux · x64 (.deb y AppImage)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linux-x64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag' && github.event.deleted != true) ||
      (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Validate release tag and source commit
        env:
          RELEASE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/check-release-ref.mjs
      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            file \
            libfuse2
      - name: Install Rust 1.99.1
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup override set 1.99.1
      - run: npm ci
      - run: npm run release:check:linux
      - run: npm test -- --maxWorkers=2
      - name: Build Debian and AppImage packages
        run: |
          npm run release:build:linux
          find state/linux.local -name "SHA256SUMS.txt" -exec cp {} state/linux.local/SHA256SUMS-linux.txt \;
      - name: Upload verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ravengit-linux-x64-${{ github.run_number }}
          path: state/linux.local/
          if-no-files-found: error
          retention-days: 30
      - name: Publish or update GitHub Release (Linux)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            state/linux.local/**/*.deb
            state/linux.local/**/*.AppImage
            state/linux.local/SHA256SUMS-linux.txt
      - name: Explain acceptance limits
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## RavenGit · Linux x64
          Descarga el artefacto `ravengit-linux-x64-<número>` al pie de esta ejecución.
          Incluye paquetes `.deb` y `.AppImage`, `SHA256SUMS-linux.txt`, licencia y manifiesto.
          El empaquetado valida metadatos de Tauri e integridad SHA-256; la aceptación visual en escritorio Wayland/X11 sigue siendo una comprobación independiente.
          EOF
